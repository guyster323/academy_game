function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function aabbOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function sign(v){ return v>0?1:(v<0?-1:0); }

/* ============================= §2 AUDIO =============================== */
const Audio_ = { ctx:null, unlocked:false };
function unlockAudio(){
  if(Audio_.unlocked) return;
  try{
    Audio_.ctx = new (window.AudioContext||window.webkitAudioContext)();
    Audio_.unlocked = true;
    startBGM();
  }catch(e){}
}
const BGM_PATTERN = [110,110,165,110,130.8,130.8,146.8,110];
let bgmStep = 0;
function startBGM(){
  if(!Audio_.ctx) return;
  const tick = ()=>{
    if(scene==='PLAY' && Audio_.ctx){
      const freq = BGM_PATTERN[bgmStep%BGM_PATTERN.length];
      beep(freq, 0.14, 'triangle', 0.045);
      if(bgmStep%2===0) beep(freq/2, 0.14, 'square', 0.02);
    }
    bgmStep++;
    setTimeout(tick, 180);
  };
  tick();
}
function beep(freq, dur, type, vol, slideTo){
  if(!Audio_.ctx) return;
  const ctx = Audio_.ctx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), ctx.currentTime+dur);
  gain.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+dur);
}

/* ============================= §3 PIXEL ART ============================ */
function bakeSprite(rows, palette){
  const h = rows.length, w = rows[0].length;
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const cx = cv.getContext('2d');
  const img = cx.createImageData(w,h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const ch = rows[y][x];
      const col = palette[ch];
      const i = (y*w+x)*4;
      if(col){
        img.data[i]=col[0]; img.data[i+1]=col[1]; img.data[i+2]=col[2]; img.data[i+3]=255;
      }
    }
  }
  cx.putImageData(img,0,0);
  return cv;
}
function flipSprite(cv){
  const o = document.createElement('canvas'); o.width=cv.width; o.height=cv.height;
  const cx = o.getContext('2d');
  cx.translate(cv.width,0); cx.scale(-1,1); cx.drawImage(cv,0,0);
  return o;
}
function flashSprite(cv){
  const o = document.createElement('canvas'); o.width=cv.width; o.height=cv.height;
  const cx = o.getContext('2d');
  cx.drawImage(cv,0,0);
  cx.globalCompositeOperation='source-in';
  cx.fillStyle='#ffffff';
  cx.fillRect(0,0,cv.width,cv.height);
  return o;
}

function showNextOnboarding(){
  if(onboarding.active || onboarding.queue.length===0) return;
  onboarding.current = ONBOARDING_EVENTS[onboarding.queue.shift()];
  onboarding.active = !!onboarding.current;
}
function queueOnboarding(key_){
  if(!ONBOARDING_EVENTS[key_] || onboarding.seen.has(key_) || onboarding.queue.indexOf(key_)!==-1) return;
  if(onboarding.current && onboarding.current===ONBOARDING_EVENTS[key_]) return;
  onboarding.queue.push(key_);
  showNextOnboarding();
}
function dismissOnboarding(){
  if(!onboarding.active || !onboarding.current) return;
  const key_ = Object.keys(ONBOARDING_EVENTS).find(k=>ONBOARDING_EVENTS[k]===onboarding.current);
  if(key_){
    onboarding.seen.add(key_);
    try{ localStorage.setItem(ONBOARDING_STORAGE_KEY, JSON.stringify([...onboarding.seen])); }catch(e){}
  }
  onboarding.active=false; onboarding.current=null;
  showNextOnboarding();
}
window.addEventListener('keydown', e=>{
  if(!Input.keys[e.code]) Input.justDown[e.code]=true;
  Input.keys[e.code]=true;
  if(onboarding.active){
    if(['Enter','KeyZ','Space'].indexOf(e.code)!==-1){
      dismissOnboarding();
      Input.justDown = {};
      e.preventDefault();
    }
    return;
  }
  if(e.code==='ArrowUp'||e.code==='ArrowDown') Input.aimMode='keyboard';
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)!==-1) e.preventDefault();
  unlockAudio();
});
window.addEventListener('keyup', e=>{ Input.keys[e.code]=false; });
const canvas = document.getElementById('game');
canvas.addEventListener('mousemove', e=>{

canvas.addEventListener('mousedown', e=>{

});

});

function key(){ for(let i=0;i<arguments.length;i++) if(Input.keys[arguments[i]]) return true; return false; }
function keyDown(){ for(let i=0;i<arguments.length;i++) if(Input.justDown[arguments[i]]) return true; return false; }

/* ============================= §5 POOLS ================================= */
function makePool(n, factory){
  const arr = [];
  for(let i=0;i<n;i++){ const o=factory(); o.active=false; arr.push(o); }
  return arr;
}
function spawnFrom(pool, init){
  for(const o of pool){ if(!o.active){ o.active=true; init(o); return o; } }
  return null;
}
const bullets = makePool(64, ()=>({x:0,y:0,vx:0,vy:0,dmg:1,life:0}));
const enemyBullets = makePool(48, ()=>({x:0,y:0,vx:0,vy:0,life:0}));
const particles = makePool(160, ()=>({x:0,y:0,vx:0,vy:0,life:0,maxLife:0,color:'#fff',size:2}));
const popups = makePool(24, ()=>({x:0,y:0,text:'',life:0,vy:0}));
const combatBursts = [];
function spawnCombatBurst(x,y,kind,dx=1,dy=0){
  combatBursts.push({x,y,kind,dx,dy,life:kind==='explosion'?26:kind==='tank-muzzle'?9:7,maxLife:kind==='explosion'?26:kind==='tank-muzzle'?9:7});
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    spawnFrom(particles, p=>{
      p.x=x; p.y=y;
      const a = Math.random()*Math.PI*2, s = 0.5+Math.random()*2.2;
      p.vx = Math.cos(a)*s; p.vy = Math.sin(a)*s-1;
      p.life = p.maxLife = 20+Math.random()*15;
      p.color = color; p.size = 1+Math.random()*2;
    });
  }
}
function spawnPopup(x,y,text){
  spawnFrom(popups, p=>{ p.x=x; p.y=y; p.text=text; p.life=50; p.vy=-0.4; });
}

/* ============================= §6 TERRAIN / CAMERA ======================= */
let terrain = [];
let conveyors = [];
const camera = { x:0, y:0, locked:false, lockX:0 };
let shaftZone = null;
function updateCamera(){
  if(camera.locked){
    camera.x += (camera.lockX-camera.x)*0.1;
    camera.x = clamp(camera.x, 0, Math.max(0, LEVEL_WIDTH-CFG.W));
    return;
  }
  const targetX = clamp(player.x - CFG.W*0.42, 0, LEVEL_WIDTH-CFG.W);
  camera.x += (targetX-camera.x)*0.14;
  camera.x = clamp(camera.x, 0, LEVEL_WIDTH-CFG.W);
  let targetY = 0;
  if(shaftZone && player.x>shaftZone.x1 && player.x<shaftZone.x2){
    targetY = clamp(player.y - CFG.H*0.5, shaftZone.minY, shaftZone.maxY);
  }
  camera.y += (targetY-camera.y)*0.12;
}

function moveAndCollide(e, dx, dy){
  e.onGround = false;
  e.x += dx;
  let box = { x:e.x+CFG.PLAYER_HB.ox, y:e.y+CFG.PLAYER_HB.oy, w:CFG.PLAYER_HB.w, h:CFG.PLAYER_HB.h };
  for(const t of terrain){
    if(aabbOverlap(box,t)){
      if(dx>0) e.x = t.x - CFG.PLAYER_HB.w - CFG.PLAYER_HB.ox;
      else if(dx<0) e.x = t.x + t.w - CFG.PLAYER_HB.ox;
      box.x = e.x+CFG.PLAYER_HB.ox;
    }
  }
  e.y += dy;
  box = { x:e.x+CFG.PLAYER_HB.ox, y:e.y+CFG.PLAYER_HB.oy, w:CFG.PLAYER_HB.w, h:CFG.PLAYER_HB.h };
  for(const t of terrain){
    if(aabbOverlap(box,t)){
      if(dy>0){ e.y = t.y - (CFG.PLAYER_HB.oy+CFG.PLAYER_HB.h); e.vy=0; e.onGround=true; }
      else if(dy<0){ e.y = t.y+t.h - CFG.PLAYER_HB.oy; e.vy=0; }
      box.y = e.y+CFG.PLAYER_HB.oy;
    }
  }
}

/* ============================= §7 WEAPONS ================================= */
const WEAPONS = {
  prompt:  { code:'',  name:'PROMPT',            infinite:true, cooldown:15, dmg:1,   speed:5.5 },
  H: { code:'H', name:'TOKEN STREAM',      maxAmmo:200, cooldown:5,  dmg:1,   speed:6.2 },
  S: { code:'S', name:'GREP SHOT',         maxAmmo:30,  cooldown:24, dmg:1,   speed:5,   spreadCount:5, spreadAngle:0.5 },
  R: { code:'R', name:'REFACTOR ROCKET',   maxAmmo:30,  cooldown:28, dmg:8,   speed:4.2, explosive:true, splashRadius:28 },
  F: { code:'F', name:'STACKTRACE FLAME',  maxAmmo:50,  cooldown:4,  dmg:0.4, speed:3.2, pierce:true, life:26 },
  L: { code:'L', name:'--verbose LASER',   maxAmmo:40,  cooldown:10, dmg:3,   speed:9,   pierce:true }
};
const MELEE_RANGE = 14;
const MELEE_DMG = 99;

/* ============================= §8 PLAYER ================================= */
const player = {
  x:80, y:CFG.GROUND_Y-1, vx:0, vy:0, facing:1, onGround:false,
  state:'idle', aim:{x:1,y:0,snapKey:'E'}, runFrame:0, runTimer:0,
  invincible:0, hitTimer:0, lives:3, alive:true, deathX:80, deathY:CFG.GROUND_Y-1,
  fireCooldown:0, meleeCooldown:0, grenadeCooldown:0,
  weapon:'prompt', ammo:0, grenades:10, powStreak:0, attackTimer:0,
  riding:false, slugCooldown:0
};
let score = 0;
let hiScore = 0;
try{ hiScore = parseInt(localStorage.getItem('cursorSlugHiScore')||'0',10); }catch(e){ hiScore=0; }
let shakeTime=0, shakeMag=0;
let hitstop = 0;

function playerHitbox(){
  return { x:player.x+CFG.PLAYER_HB.ox, y:player.y+CFG.PLAYER_HB.oy, w:CFG.PLAYER_HB.w, h:CFG.PLAYER_HB.h };
}

function snapDir(dx,dy){
  if(dx===0 && dy===0) return player.facing>0?'E':'W';
  const ang = Math.atan2(dy,dx);
  const dirs = ['E','SE','S','SW','W','NW','N','NE'];
  let idx = Math.round(ang/(Math.PI/4));
  idx = ((idx%8)+8)%8;
  return dirs[idx];
}
function computeAim(){
  if(Input.aimMode==='mouse'){
    const wx = Input.mouseX + camera.x, wy = Input.mouseY + camera.y;
    const dx = wx-player.x, dy = wy-(player.y-8);
    const len = Math.hypot(dx,dy)||1;
    return { x:dx/len, y:dy/len, snapKey: snapDir(dx,dy) };
  }
  let hx = key('ArrowRight')?1:(key('ArrowLeft')?-1:0);
  let vy = key('ArrowUp')?-1:0;
  if(key('ArrowDown') && player.onGround){ hx=0; vy=0; }
  if(hx===0 && vy===0) hx = player.facing;
  const len = Math.hypot(hx,vy)||1;
  return { x:hx/len, y:vy/len, snapKey: snapDir(hx,vy) };
}

function killPlayer(){
  if(bossEntryGrace>0) return;
  if(player.riding){ damageSlug(); return; }
  if(player.hitTimer>0 || player.invincible>0) return;
  SFX.playerDie();
  spawnParticles(player.x, player.y-8, '#D97757', 18);
  shakeTime=20; shakeMag=3; hitstop=CFG.HITSTOP_FRAMES;
  player.lives--;
  if(player.lives<=0){
    player.alive=false;
    gameOver();
  } else {
    player.hitTimer = 40;
    player.invincible = CFG.INVINCIBLE_TIME;
    player.x = player.deathX; player.y = player.deathY;
    player.vx=0; player.vy=-3;
    player.weapon='prompt'; player.ammo=0;
    if(bossFightActive){
      for(const b of enemyBullets) b.active=false;
    }
  }
}

function updatePlayer(){
  if(!player.alive) return;
  if(player.invincible>0) player.invincible--;
  if(player.attackTimer>0) player.attackTimer--;

  if(player.hitTimer>0){
    player.hitTimer--;
    player.vy += CFG.GRAVITY; player.vy = Math.min(player.vy, CFG.MAX_FALL);
    moveAndCollide(player, 0, player.vy);
    Input.justDown = {};
    return;
  }

  checkSlugMount();
  const dismounted = handleSlugDismount();
  updateSlugFx();

  const crouching = key('ArrowDown') && player.onGround && !player.riding;
  player.aim = computeAim();
  if(Input.aimMode==='mouse') player.facing = player.aim.x>=0?1:-1;

  let vx = 0;
  if(!crouching){
    vx = key('ArrowRight')?CFG.MOVE_SPEED:(key('ArrowLeft')?-CFG.MOVE_SPEED:0);
    if(vx!==0 && Input.aimMode!=='mouse') player.facing = sign(vx);
  }

  if(!player.riding && !dismounted){
    if(keyDown('KeyZ','Space') && player.onGround){
      player.vy = CFG.JUMP_VEL; player.onGround=false; SFX.jump();
    }
    if(!key('KeyZ','Space') && player.vy < CFG.JUMP_VEL*CFG.JUMP_CUT){
      player.vy = CFG.JUMP_VEL*CFG.JUMP_CUT;
    }
  }

  player.vy += CFG.GRAVITY;
  if(player.vy>CFG.MAX_FALL) player.vy=CFG.MAX_FALL;

  moveAndCollide(player, vx, player.vy);
  if(player.onGround){
    for(const c of conveyors){
      if(player.x>c.x && player.x<c.x+c.w && Math.abs(player.y-c.y)<3){
        player.x += c.push;
        break;
      }
    }
  }
  const minX = bossFightActive ? arenaLeftBound : 8;
  player.x = clamp(player.x, minX, LEVEL_WIDTH-8);

  if(crouching) player.state='crouch';
  else if(!player.onGround) player.state = 'jump';
  else player.state = vx!==0?'run':'idle';

  if(player.state==='run'){
    player.runTimer++;
    if(player.runTimer>=7){ player.runTimer=0; player.runFrame=(player.runFrame+1)%6; }
  } else player.runTimer=0;

  if(!bossFightActive){ player.deathX = player.x; player.deathY = player.y; }
  if(player.riding && slug){ slug.x=player.x; slug.y=player.y; }

  handleShoot();
  handleGrenade();
  Input.justDown = {};
  Input.mouseRightJustDown = false;
}

/* ============================= §9 WEAPON / MELEE / GRENADE ================ */
function nearestEnemyInRange(range){
  let best=null, bestDist=Infinity;
  for(const en of enemies){
    if(!en.active) continue;
    const dx = en.x-player.x, dy = en.y-8-(player.y-8);
    const d = Math.hypot(dx,dy);
    if(d<range && d<bestDist){ bestDist=d; best=en; }
  }
  return best;
}
function meleeAttack(target){
  target.hp -= MELEE_DMG; target.flash=6;
  spawnParticles(target.x,target.y,'#ffffff',6);
  if(target.hp<=0) killEnemy(target);
  player.attackTimer=5;
  SFX.melee();
}
function spawnBullet(aim, wdef, spreadOffset){
  const ang = Math.atan2(aim.y,aim.x) + (spreadOffset||0);
  const dx = Math.cos(ang), dy = Math.sin(ang);
  spawnFrom(bullets, b=>{
    b.x = player.x + dx*8; b.y = player.y-9 + dy*6;
    b.vx = dx*wdef.speed; b.vy = dy*wdef.speed;
    b.dmg = wdef.dmg; b.life = wdef.life||70;
    b.pierce = !!wdef.pierce; b.explosive = !!wdef.explosive; b.splashRadius = wdef.splashRadius||0;
    b.hitSet = wdef.pierce ? new Set() : null;
  });
}
function fireWeapon(){
  const wdef = WEAPONS[player.weapon];
  const aim = player.aim;
  if(wdef.spreadCount){
    for(let i=0;i<wdef.spreadCount;i++){
      const off = (i-(wdef.spreadCount-1)/2) * (wdef.spreadAngle/(wdef.spreadCount-1));
      spawnBullet(aim, wdef, off);
    }
  } else {
    spawnBullet(aim, wdef, 0);
  }
  SFX.shoot();
  player.attackTimer=6;
  spawnCombatBurst(player.x + aim.x*8, player.y-9 + aim.y*5, 'muzzle', aim.x, aim.y);
  if(!wdef.infinite){
    player.ammo--;
    if(player.ammo<=0){ player.weapon='prompt'; player.ammo=0; }
  }
}
function handleShoot(){
  if(player.riding){ handleSlugFire(); return; }
  if(player.fireCooldown>0) player.fireCooldown--;
  if(player.meleeCooldown>0) player.meleeCooldown--;
  const wantFire = key('KeyX') || Input.mouseDown;
  if(!wantFire) return;
  const meleeTarget = nearestEnemyInRange(MELEE_RANGE);
  if(meleeTarget){
    if(player.meleeCooldown<=0){ player.meleeCooldown=12; meleeAttack(meleeTarget); }
    return;
  }
  if(player.fireCooldown<=0){
    const wdef = WEAPONS[player.weapon];
    player.fireCooldown = wdef.cooldown;
    fireWeapon();
  }
}

const grenades = makePool(12, ()=>({x:0,y:0,vx:0,vy:0,life:0}));
function handleGrenade(){
  if(player.grenadeCooldown>0) player.grenadeCooldown--;
  else player.grenadeCooldown=0;
  const wantThrow = keyDown('KeyC') || Input.mouseRightJustDown;
  if(wantThrow && player.grenades>0 && (player.grenadeCooldown||0)<=0){
    queueOnboarding('grenade');
    player.grenades--;
    player.grenadeCooldown = 20;
    const aim = player.aim;
    spawnFrom(grenades, g=>{
      g.x = player.x + aim.x*6; g.y = player.y-9;
      g.vx = aim.x*3.4 + (aim.y<0?0.6*sign(aim.x||1):0);
      g.vy = aim.y<0 ? -4.2 : -2.6;
      g.life = 200;
    });
    SFX.grenadeThrow();
  }
}
function explodeAt(x,y,radius,dmg){
  spawnCombatBurst(x,y,'explosion');
  spawnParticles(x,y,'#ff9955',16);
  shakeTime=Math.max(shakeTime,16); shakeMag=Math.max(shakeMag,3);
  SFX.explode();
  for(const en of enemies){
    if(!en.active) continue;
    if(Math.hypot(en.x-x,en.y-en.hh-y)<radius+en.hw){
      en.hp -= dmg; en.flash=6;
      if(en.hp<=0) killEnemy(en);
    }
  }
  if(boss && boss.active && !boss.dying){
    const box = { x:boss.x-boss.hw, y:boss.y-boss.hh*2, w:boss.hw*2, h:boss.hh*2 };
    const closestX = clamp(x, box.x, box.x+box.w);
    const closestY = clamp(y, box.y, box.y+box.h);
    if(Math.hypot(x-closestX,y-closestY)<radius && boss.vulnerable){
      bossTakeDamage(dmg, x, y);
    }
  }
  const hb = playerHitbox();
  const cx = hb.x+hb.w/2, cy = hb.y+hb.h/2;
  if(Math.hypot(cx-x,cy-y)<radius) killPlayer();
}
function updateGrenades(){
  for(const g of grenades){
    if(!g.active) continue;
    g.vy += CFG.GRAVITY*0.7;
    g.x += g.vx; g.y += g.vy; g.life--;
    let exploded=false;
    for(const t of terrain){
      if(g.x>t.x && g.x<t.x+t.w && g.y>t.y && g.y<t.y+t.h){ exploded=true; break; }
    }
    if(!exploded){
      for(const en of enemies){
        if(!en.active) continue;
        if(Math.abs(g.x-en.x)<en.hw && Math.abs(g.y-(en.y-en.hh))<en.hh){ exploded=true; break; }
      }
    }
    if(g.life<=0) exploded=true;
    if(exploded){ g.active=false; explodeAt(g.x,g.y,26,6); }
  }
}

function updateBullets(){
  for(const b of bullets){
    if(!b.active) continue;
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.life<=0){ b.active=false; continue; }
    let hitTerrain=false;
    for(const t of terrain){
      if(b.x>t.x && b.x<t.x+t.w && b.y>t.y && b.y<t.y+t.h){ hitTerrain=true; break; }
    }
    if(hitTerrain){
      if(b.explosive) explodeAt(b.x,b.y,b.splashRadius,b.dmg);
      b.active=false; continue;
    }
    for(const en of enemies){
      if(!en.active) continue;
      if(b.hitSet && b.hitSet.has(en)) continue;
      const pad = 3;
      const box = { x:en.x-en.hw-pad, y:en.y-en.hh*2-pad, w:en.hw*2+pad*2, h:en.hh*2+pad*2 };
      if(b.x>=box.x && b.x<=box.x+box.w && b.y>=box.y && b.y<=box.y+box.h){
        en.hp -= b.dmg; en.flash=6;
        spawnParticles(b.x,b.y,'#ffcc55',4);
        if(en.hp<=0) killEnemy(en);
        if(b.explosive){ explodeAt(b.x,b.y,b.splashRadius,b.dmg); b.active=false; break; }
        if(b.pierce){ b.hitSet.add(en); } else { b.active=false; break; }
      }
    }
    if(!b.active) continue;
    if(boss && boss.active && !boss.dying){
      const bpad = 3;
      const bbox = { x:boss.x-boss.hw-bpad, y:boss.y-boss.hh*2-bpad, w:boss.hw*2+bpad*2, h:boss.hh*2+bpad*2 };
      if(b.x>=bbox.x && b.x<=bbox.x+bbox.w && b.y>=bbox.y && b.y<=bbox.y+bbox.h){
        if(boss.vulnerable){
          bossTakeDamage(b.dmg, b.x, b.y);
          if(b.explosive){ explodeAt(b.x,b.y,b.splashRadius,0); }
          if(!b.pierce){ b.active=false; continue; }
        } else {
          spawnParticles(b.x,b.y,'#8899aa',3);
          if(!b.pierce){ b.active=false; continue; }
        }
      }
    }
    for(const it of items){
      if(!it.active || it.kind!=='crate') continue;
      const box = { x:it.x-6, y:it.y-14, w:12, h:14 };
      if(b.x>=box.x && b.x<=box.x+box.w && b.y>=box.y && b.y<=box.y+box.h){
        it.hp -= b.dmg; it.flash=6; b.active=false;
        spawnParticles(b.x,b.y,'#ffcc55',3);
        if(it.hp<=0) killCrate(it);
        break;
      }
    }
  }
  for(const b of enemyBullets){
    if(!b.active) continue;
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.life<=0){ b.active=false; continue; }
    const hb = playerHitbox();
    if(b.x>hb.x && b.x<hb.x+hb.w && b.y>hb.y && b.y<hb.y+hb.h){
      b.active=false; killPlayer();
    }
  }
  updateGrenades();
}

/* ============================= §8c SLUG (CONTAINER TANK) =================== */
const SLUG_MOUNT_RANGE = 16;
const SLUG_MAX_DUR = 3;
let slug = null;
function spawnSlug(x,y){
  slug = { active:true, x, y, durability:SLUG_MAX_DUR, flash:0, invincible:0 };
}
function damageSlug(){
  if(!slug || slug.invincible>0) return;
  slug.invincible = 50;
  slug.durability--; slug.flash=10;
  shakeTime=Math.max(shakeTime,14); shakeMag=Math.max(shakeMag,3);
  spawnParticles(player.x,player.y-10,'#cccccc',10);
  SFX.hurt();
  if(slug.durability<=0){
    spawnParticles(player.x,player.y-10,'#ffaa55',24);
    shakeTime=24; shakeMag=5; SFX.explode();
    player.riding=false;
    player.invincible=CFG.INVINCIBLE_TIME;
    slug.active=false; slug=null;
  }
}
function checkSlugMount(){
  if(player.riding || !slug || !slug.active) return;
  if(Math.hypot(player.x-slug.x, player.y-slug.y)<SLUG_MOUNT_RANGE){
    player.riding = true;
    player.x = slug.x; player.y = slug.y; player.vy=0;
    queueOnboarding('tank');
  }
}
function handleSlugDismount(){
  if(!player.riding) return false;
  if(key('ArrowDown') && keyDown('KeyZ','Space')){
    player.riding = false;
    player.invincible = 30;
    if(slug){ slug.x=player.x; slug.y=player.y; }
    return true;
  }
  return false;
}
function handleSlugFire(){
  if(player.slugCooldown>0){ player.slugCooldown--; return; }
  const wantFire = key('KeyX') || Input.mouseDown;
  if(!wantFire) return;
  player.slugCooldown = 22;
  const aim = player.aim;
  spawnFrom(bullets, b=>{
    b.x = player.x + aim.x*10; b.y = player.y-10 + aim.y*6;
    b.vx = aim.x*5; b.vy = aim.y*5;
    b.dmg=10; b.life=80; b.pierce=false; b.explosive=true; b.splashRadius=32; b.hitSet=null;
  });
  player.attackTimer=8;
  spawnCombatBurst(player.x + aim.x*10, player.y-10 + aim.y*5, 'tank-muzzle', aim.x, aim.y);
  SFX.shoot();
}
function updateSlugFx(){
  if(!slug) return;
  if(slug.flash>0) slug.flash--;
  if(slug.invincible>0) slug.invincible--;
}

/* ============================= §9 ENEMIES ================================ */
const ENEMY_DEF = {
  nullptr: { hp:1, hw:4, hh:5, score:100, speed:0.5 },
  segfault:{ hp:1, hw:4, hh:4, score:150, speed:0 },
  infloop: { hp:2, hw:4, hh:3, score:250, speed:0.6 },
  stackov: { hp:2, hw:4, hh:5, score:200, speed:0.4 },
  memleak: { hp:3, hw:4, hh:4, score:300, speed:0.35 },
  deprecated:{ hp:6, hw:5, hh:6, score:500, speed:0 },
  racecond:{ hp:3, hw:4, hh:5, score:400, speed:1.4 }
};
const enemies = [];
function spawnEnemy(type,x,y){
  const def = ENEMY_DEF[type];
  enemies.push({
    active:true, type, x, y, baseY:y, hp:def.hp, maxHp:def.hp, hw:def.hw, hh:def.hh,
    score:def.score, speed:def.speed, facing:-1, timer:Math.random()*60,
    flash:0, t:0, splitDone:false, teleTimer:60+Math.random()*40, dashing:false
  });
}
function killEnemy(en){
  en.active=false;
  score += en.score;
  spawnPopup(en.x, en.y-10, '+'+en.score);
  spawnParticles(en.x, en.y, '#ff5555', 10);
  SFX.enemyDie();
  if(en.type==='memleak' && !en.splitDone){
    for(const dx of [-10,10]){
      spawnEnemy('memleak', en.x+dx, en.y);
      const child = enemies[enemies.length-1];
      child.splitDone = true; child.hp=1; child.maxHp=1; child.hw=3; child.hh=3;
    }
  }
}
function fireEnemyBullet(x,y,dx,dy,speed){
  const len=Math.hypot(dx,dy)||1;
  spawnFrom(enemyBullets, b=>{ b.x=x; b.y=y; b.vx=dx/len*speed; b.vy=dy/len*speed; b.life=120; });
}
function updateEnemies(){
  for(const en of enemies){
    if(!en.active) continue;
    if(en.flash>0) en.flash--;
    en.t++;
    if(en.type==='nullptr'){
      const dx = player.x-en.x;
      if(Math.abs(dx)>18) en.x += sign(dx)*en.speed;
      en.facing = sign(dx)||en.facing;
      en.timer--;
      if(en.timer<=0 && Math.abs(dx)<160 && Math.abs(player.y-en.y)<40){
        en.timer=90;
        fireEnemyBullet(en.x,en.y-4,dx,player.y-en.y,2.2);
      }
    } else if(en.type==='segfault'){
      en.facing = sign(player.x-en.x)||en.facing;
      en.timer--;
      if(en.timer<=0 && Math.abs(player.x-en.x)<200){
        en.timer=90;
        fireEnemyBullet(en.x,en.y-3,player.x-en.x,player.y-en.y,2.6);
      }
    } else if(en.type==='infloop'){
      en.y = en.baseY + Math.sin(en.t*0.05)*10;
      const dx = player.x-en.x;
      en.x += sign(dx)*en.speed;
      en.facing = sign(dx)||en.facing;
      en.timer--;
      if(en.timer<=0 && Math.abs(dx)<60){
        en.timer=110;
        fireEnemyBullet(en.x,en.y+4,0,1,1.8);
      }
    } else if(en.type==='stackov'){
      const dx = player.x-en.x;
      if(Math.abs(dx)<90) en.x -= sign(dx)*en.speed;
      else if(Math.abs(dx)>140) en.x += sign(dx)*en.speed;
      en.facing = sign(dx)||en.facing;
      en.timer--;
      if(en.timer<=0 && Math.abs(dx)<220){
        en.timer=100;
        const dist = Math.abs(dx)||1;
        fireEnemyBullet(en.x,en.y-6, sign(dx)*0.9, -1.1, 2.0);
      }
    } else if(en.type==='memleak'){
      const dx = player.x-en.x;
      if(Math.abs(dx)>10) en.x += sign(dx)*en.speed;
      en.facing = sign(dx)||en.facing;
    } else if(en.type==='deprecated'){
      en.timer--;
      if(en.timer<=0){
        en.timer=100;
        for(let i=-1;i<=1;i++){
          const dx=player.x-en.x, dy=(player.y-8)-(en.y-8);
          const ang = Math.atan2(dy,dx) + i*0.3;
          fireEnemyBullet(en.x,en.y-6, Math.cos(ang), Math.sin(ang), 2.2);
        }
      }
    } else if(en.type==='racecond'){
      en.teleTimer--;
      if(en.teleTimer<=0){
        if(!en.dashing){
          en.dashing=true; en.teleTimer=45;
          const dx = player.x-en.x;
          en.facing = sign(dx)||en.facing;
          en.dashVX = en.facing*en.speed;
          spawnParticles(en.x,en.y-4,'#dd66ff',6);
        } else {
          en.dashing=false; en.teleTimer=70+Math.random()*40;
          en.dashVX=0;
        }
      }
      if(en.dashing) en.x += en.dashVX;
    }
    const hb = playerHitbox();
    const box = { x:en.x-en.hw, y:en.y-en.hh*2, w:en.hw*2, h:en.hh*2 };
    if(aabbOverlap(hb,box)){
      if(player.riding && en.type!=='infloop') killEnemy(en);
      else killPlayer();
    }
  }
}

let boss = null;
const BOSS_DEFS = {
  gate1: { name:'NULL POINTER GATE', maxHp:120, hw:33, hh:18, scoreValue:10000, drawScale:3 },
  hydra: { name:'MEMORY LEAK HYDRA', maxHp:160, hw:33, hh:21, scoreValue:15000, drawScale:3 },
  halluc:{ name:'HALLUCINATION', maxHp:200, hw:36, hh:24, scoreValue:20000, drawScale:3.2 }
};
function spawnBoss(type, x, y){
  const def = BOSS_DEFS[type];
  boss = {
    active:true, type, x, y, baseY:y, hp:def.maxHp, maxHp:def.maxHp, hw:def.hw, hh:def.hh,
    scale:def.drawScale||1, scoreValue:def.scoreValue, phase:0, timer:0, vulnerable:true, flash:0,
    dying:false, deathTimer:0, chargeVX:0, anchorX:x, name:def.name
  };
}
function bossTakeDamage(dmg, hx, hy){
  if(!boss || !boss.active || boss.dying || !boss.vulnerable) return;
  boss.flash=6;
  spawnParticles(hx,hy,'#ffcc55',4);
  if(demoActive && boss._demoTuned) return;   // reel: HP follows a scripted ramp, hits stay cosmetic
  boss.hp -= dmg;
  if(boss.hp<=0){
    boss.hp=0; boss.dying=true; boss.deathTimer=90;
  }
}
function updateBoss(){
  if(!boss || !boss.active) return;
  if(boss.flash>0) boss.flash--;
  if(boss.dying){
    boss.deathTimer--;
    if(boss.deathTimer%6===0){
      spawnParticles(boss.x+(Math.random()-0.5)*boss.hw*2, boss.y-Math.random()*boss.hh*1.6, '#ffaa55', 8);
      shakeTime=Math.max(shakeTime,8); shakeMag=Math.max(shakeMag,2);
    }
    if(boss.deathTimer<=0){
      boss.active=false;
      score += boss.scoreValue;
      spawnParticles(boss.x, boss.y-boss.hh, '#ffffff', 30);
      shakeTime=30; shakeMag=5;
      SFX.explode();
      stageClear();
    }
    return;
  }
  const hpFrac = boss.hp/boss.maxHp;
  const newPhase = hpFrac>0.66 ? 1 : (hpFrac>0.33 ? 2 : 3);
  if(newPhase!==boss.phase){ boss.phase=newPhase; boss.timer=0; }
  boss.timer++;

  if(boss.type==='gate1') bossPatternGate1();
  else if(boss.type==='hydra') bossPatternHydra();
  else if(boss.type==='halluc') bossPatternHalluc();

  const hb = playerHitbox();
  const box = { x:boss.x-boss.hw, y:boss.y-boss.hh*2, w:boss.hw*2, h:boss.hh*2 };
  if(aabbOverlap(hb,box)) killPlayer();
}
function bossPatternGate1(){
  if(boss.phase===1){
    boss.vulnerable = true;
    boss.x += (boss.anchorX-boss.x)*0.05;
    if(boss.timer%80===0){
      const dx=player.x-boss.x, dy=(player.y-8)-(boss.y-boss.hh*0.6);
      for(let i=-2;i<=2;i++){
        const spreadAng = Math.atan2(dy,dx) + i*0.22;
        fireEnemyBullet(boss.x-boss.hw*0.6, boss.y-boss.hh*0.6, Math.cos(spreadAng), Math.sin(spreadAng), 2.4);
      }
    }
  } else if(boss.phase===2){
    const cyclePos = boss.timer%140;
    if(cyclePos<40){
      boss.vulnerable = true;
    } else if(cyclePos<75){
      boss.vulnerable = false;
      boss.x -= 3.2;
      shakeTime=Math.max(shakeTime,4); shakeMag=Math.max(shakeMag,1.5);
    } else if(cyclePos<115){
      boss.vulnerable = true;
      boss.x += (boss.anchorX-boss.x)*0.08;
    } else {
      boss.vulnerable = true;
    }
  } else {
    boss.vulnerable = true;
    boss.x += (boss.anchorX-boss.x)*0.05;
    if(boss.timer%50===0){
      const dx=player.x-boss.x, dy=(player.y-8)-(boss.y-boss.hh*0.6);
      const len=Math.hypot(dx,dy)||1;
      fireEnemyBullet(boss.x-boss.hw*0.6, boss.y-boss.hh*0.6, dx/len, dy/len, 3.4);
    }
  }
}
function bossPatternHydra(){
  boss.y = boss.baseY + Math.sin(boss.timer*0.04)*4;
  if(boss.phase===1){
    boss.vulnerable = true;
    if(boss.timer%60===0){
      for(let i=0;i<3;i++){
        const ang = -0.5+i*0.5 + (Math.random()-0.5)*0.1;
        fireEnemyBullet(boss.x-boss.hw*0.5, boss.y-boss.hh*0.8, Math.cos(Math.PI-ang), Math.sin(Math.PI-ang)*-1+0.3, 2.2);
      }
    }
  } else if(boss.phase===2){
    const cyclePos = boss.timer%90;
    boss.vulnerable = cyclePos>=15;
    if(boss.timer%90===0){
      shakeTime=Math.max(shakeTime,10); shakeMag=Math.max(shakeMag,2.5);
      for(let i=-3;i<=3;i++){
        fireEnemyBullet(boss.x, boss.y-boss.hh, i*0.28, -1, 2.6);
      }
    }
  } else {
    boss.vulnerable = true;
    if(boss.timer%35===0){
      const dx=player.x-boss.x, dy=(player.y-8)-(boss.y-boss.hh*0.6);
      const len=Math.hypot(dx,dy)||1;
      fireEnemyBullet(boss.x-boss.hw*0.5, boss.y-boss.hh*0.6, dx/len, dy/len, 3.6);
    }
  }
}
function bossPatternHalluc(){
  boss.decoyOffsets = [-70,70];
  if(boss.phase===1){
    boss.vulnerable = true;
    boss.x += (boss.anchorX-boss.x)*0.04;
    boss.y = boss.baseY + Math.sin(boss.timer*0.03)*8;
    if(boss.timer%70===0){
      const dx=player.x-boss.x, dy=(player.y-8)-(boss.y-boss.hh*0.6);
      const len=Math.hypot(dx,dy)||1;
      fireEnemyBullet(boss.x,boss.y-boss.hh*0.6, dx/len, dy/len, 2.4);
    }
  } else if(boss.phase===2){
    const cyclePos = boss.timer%160;
    if(cyclePos===1){ boss.dashTargetX = player.x; }
    if(cyclePos<50){
      boss.vulnerable = false;
      boss.x += (boss.dashTargetX-boss.x)*0.06;
    } else if(cyclePos<70){
      boss.vulnerable = false;
      shakeTime=Math.max(shakeTime,6); shakeMag=Math.max(shakeMag,2);
    } else {
      boss.vulnerable = true;
      boss.x += (boss.anchorX-boss.x)*0.05;
    }
  } else {
    boss.vulnerable = true;
    if(boss.timer%55===0){
      for(let i=0;i<8;i++){
        const ang = (Math.PI*2/8)*i;
        fireEnemyBullet(boss.x,boss.y-boss.hh*0.6, Math.cos(ang), Math.sin(ang), 2.2);
      }
    }
  }
}
function checkBossTrigger(){
  if(bossFightActive || (boss && boss.active) || !bossTriggerX) return;
  if(player.x >= bossTriggerX){
    bossFightActive = true;
    bossEntryGrace = BOSS_ENTRY_GRACE;
    player.invincible = Math.max(player.invincible, BOSS_ENTRY_GRACE);
    // Move the operator onto the visible side of the locked arena camera.
    // Previously the stage-end camera could leave the player just off-screen
    // while the boss bullets were already active.
    const arenaBossX = clamp(Math.max(bossArenaCamX + CFG.W*0.62, bossTriggerX+100), bossTriggerX+80, LEVEL_WIDTH-40);
    const arenaPlayerX = clamp(Math.max(arenaBossX-140, arenaLeftBound+8), arenaLeftBound+8, LEVEL_WIDTH-16);
    player.x = arenaPlayerX;
    player.y = bossFloorY;
    player.vx = 0; player.vy = 0; player.onGround = true; player.state = 'idle';
    player.deathX = arenaPlayerX;
    player.deathY = bossFloorY;
    for(const b of enemyBullets) b.active=false;
    for(const en of enemies) en.active=false;
    // The boss arena is a clean encounter: do not let the streaming scripts
    // repopulate enemies or rewards after the trigger frame.
    spawnIdx = SPAWN_SCRIPT.length;
    itemSpawnIdx = ITEM_SCRIPT.length;
    powSpawnIdx = POW_SCRIPT.length;
    camera.locked = true;
    camera.lockX = bossArenaCamX;
    camera.x = clamp(camera.x, 0, Math.max(0, LEVEL_WIDTH-CFG.W));
    if(shaftZone){
      camera.y = clamp(bossFloorY-CFG.H*0.5, shaftZone.minY, shaftZone.maxY);
    } else {
      camera.y = 0;
    }
    spawnBoss(currentBossType, arenaBossX, bossFloorY);
    queueOnboarding('boss-'+stageNum);
  }
}

const POW_STREAK_SCORES = [1000,2000,4000,8000];
const pows = [];
function spawnPow(x,y){
  pows.push({ active:true, x, y, freed:false, freeTimer:0 });
}
function rescuePow(p){
  p.freed = true; p.freeTimer = 60;
  queueOnboarding('pow');
  const streakScore = POW_STREAK_SCORES[Math.min(player.powStreak, POW_STREAK_SCORES.length-1)];
  player.powStreak++;
  const roll = Math.random();
  if(roll<0.34){
    const key_ = WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
    collectWeapon(key_);
    spawnPopup(p.x,p.y-14, WEAPONS[key_].code+' GET');
  } else if(roll<0.67){
    player.grenades = Math.min(30, player.grenades+5);
    spawnPopup(p.x,p.y-14, '+5 SIGKILL');
  } else {
    spawnPopup(p.x,p.y-14, '+'+streakScore);
  }
  score += streakScore;
  spawnParticles(p.x,p.y-6,'#7fffb0',12);
  SFX.pow();
}
function updatePows(){
  const hb = playerHitbox();
  for(const p of pows){
    if(!p.active) continue;
    if(p.freed){ p.freeTimer--; if(p.freeTimer<=0) p.active=false; continue; }
    const box = { x:p.x-5, y:p.y-14, w:10, h:14 };
    const meleeTarget = Math.hypot(p.x-player.x, (p.y-8)-(player.y-8))<MELEE_RANGE && key('KeyX');
    if(aabbOverlap(hb,box) || meleeTarget) rescuePow(p);
  }
}

function updateFx(){
  for(const p of particles){
    if(!p.active) continue;
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--;
    if(p.life<=0) p.active=false;
  }
  for(const p of popups){
    if(!p.active) continue;
    p.y+=p.vy; p.life--;
    if(p.life<=0) p.active=false;
  }
  for(let i=combatBursts.length-1;i>=0;i--){
    combatBursts[i].life--;
    if(combatBursts[i].life<=0) combatBursts.splice(i,1);
  }
  if(shakeTime>0) shakeTime--; else shakeMag=0;
}

const STAGE_NAMES = ['SANDBOX DESERT','MEMORY CAVERN','KERNEL FORTRESS'];
let scene = 'TITLE';
let stageClearTimer = 0;
let stageClearBonus = 0;

function loadStage(n){
  stageNum = n;
  boss = null; bossFightActive=false; camera.locked=false; camera.lockX=0;
  bossEntryGrace=0;
  slug = null; player.riding = false;
  spawnIdx=0; itemSpawnIdx=0; powSpawnIdx=0;
  enemies.length=0; items.length=0; pows.length=0;
  for(const b of bullets) b.active=false;
  for(const b of enemyBullets) b.active=false;
  for(const g of grenades) g.active=false;
  for(const p of particles) p.active=false;
  for(const p of popups) p.active=false;
  combatBursts.length=0;
  if(n===1) buildStage1();
  else if(n===2) buildStage2();
  else if(n===3) buildStage3();
  player.x=80; player.y=CFG.GROUND_Y-1; player.vx=0; player.vy=0; player.facing=1;
  player.deathX=80; player.deathY=CFG.GROUND_Y-1;
  camera.x=0; camera.y=0;
}
function resetGame(){
  Input.justDown = {};
  score=0;
  player.lives=3; player.alive=true; player.hitTimer=0; player.invincible=90;
  player.weapon='prompt'; player.ammo=0; player.grenades=10; player.powStreak=0;
  player.fireCooldown=0; player.meleeCooldown=0; player.grenadeCooldown=0; player.slugCooldown=0; player.attackTimer=0;
  loadStage(1);
  scene='PLAY';
  queueOnboarding('controls');
  document.getElementById('restartBtn').style.display='none';
}
function gameOver(){
  scene='GAMEOVER';
  if(score>hiScore){ hiScore=score; try{ localStorage.setItem('cursorSlugHiScore',String(hiScore)); }catch(e){} }
  document.getElementById('restartBtn').style.display='block';
}
function stageClear(){
  scene='STAGECLEAR';
  stageClearBonus = player.grenades*100;
  score += stageClearBonus;
  stageClearTimer = 180;
}
function advanceStage(){
  Input.justDown = {};
  if(stageNum>=STAGE_COUNT){
    scene='ENDING';
    if(score>hiScore){ hiScore=score; try{ localStorage.setItem('cursorSlugHiScore',String(hiScore)); }catch(e){} }
    document.getElementById('restartBtn').style.display='block';
    return;
  }
  player.powStreak=0;
  loadStage(stageNum+1);
  player.invincible=90;
  scene='PLAY';
}
document.getElementById('restartBtn').addEventListener('click', ()=>{ resetGame(); });
window.addEventListener('keydown', e=>{
  if(scene==='TITLE'){ resetGame(); }
  else if(scene==='GAMEOVER' && e.code==='KeyR'){ resetGame(); }
  else if(scene==='ENDING' && e.code==='KeyR'){ resetGame(); }
  else if(scene==='STAGECLEAR' && stageClearTimer<=0){ advanceStage(); }
});

const ctx = canvas.getContext('2d');

const RENDER_SCALE = 2;
canvas.width = CFG.W*RENDER_SCALE;
canvas.height = CFG.H*RENDER_SCALE;

function loadArt(src){
  const img = new Image();
  img.decoding = 'async';
  img.src = src;
  return img;
}
function artReady(img){ return !!(img && img.complete && img.naturalWidth>0); }

let terrainPattern = null;
function getTerrainPattern(){
  if(terrainPattern || !artReady(ART.terrain)) return terrainPattern;
  const tile=document.createElement('canvas'); tile.width=64; tile.height=40;
  const tctx=tile.getContext('2d'); tctx.imageSmoothingEnabled=false;
  tctx.drawImage(ART.terrain,0,0,64,40);
  terrainPattern=ctx.createPattern(tile,'repeat');
  return terrainPattern;
}
function drawArtAtFeet(img, centerX, feetY, targetHeight, flip=false, alpha=1){
  if(!artReady(img)) return false;
  const ratio = img.naturalWidth/Math.max(1,img.naturalHeight);
  const dw = targetHeight*ratio, dh = targetHeight;
  ctx.save(); ctx.globalAlpha=alpha;
  if(flip){
    ctx.translate(centerX+dw/2, feetY-dh); ctx.scale(-1,1);
    ctx.drawImage(img,0,0,dw,dh);
  } else {
    ctx.drawImage(img,centerX-dw/2,feetY-dh,dw,dh);
  }
  ctx.restore();
  return true;
}

function drawParallax(){
  const bg = ART && ART.backgrounds[stageNum];
  if(artReady(bg)){
    // Render one oversize panoramic plate rather than repeating the image.
    // This keeps the hand-painted skyline continuous while the camera adds
    // a restrained parallax drift across the long stage.
    const bgW=CFG.W*1.5, bgH=CFG.H;
    const restingOffset=(CFG.W-bgW)*0.5;
    const offset = clamp(restingOffset-camera.x*0.16, CFG.W-bgW, 0);
    ctx.drawImage(bg,offset,0,bgW,bgH);
    const shade=ctx.createLinearGradient(0,0,0,CFG.H);
    shade.addColorStop(0,'rgba(7,10,24,0.10)');
    shade.addColorStop(0.72,'rgba(7,10,24,0.02)');
    shade.addColorStop(1,'rgba(4,5,12,0.30)');
    ctx.fillStyle=shade; ctx.fillRect(0,0,CFG.W,CFG.H);
    return;
  }
  ctx.fillStyle='#111629'; ctx.fillRect(0,0,CFG.W,CFG.H);
  ctx.fillStyle='#242438';
  for(let i=0;i<8;i++){
    const bx = ((i*140 - camera.x*0.3) % (CFG.W+140) + (CFG.W+140)) % (CFG.W+140) - 70;
    ctx.fillRect(bx, 60, 40, 130);
  }
  ctx.fillStyle='#2c2c44';
  for(let i=0;i<10;i++){
    const bx = ((i*100 - camera.x*0.6) % (CFG.W+100) + (CFG.W+100)) % (CFG.W+100) - 50;
    ctx.fillRect(bx, 100, 26, 100);
  }
}
function drawConveyors(){
  const t = performance.now ? (Date.now()/80) : 0;
  for(const c of conveyors){
    const sx = c.x-camera.x, sy = c.y-camera.y;
    ctx.fillStyle = '#333';
    ctx.fillRect(sx, sy, c.w, 6);
    ctx.fillStyle = '#8a9a4a';
    const stripeW = 10, offset = ((t*(c.push>0?1:-1))%stripeW+stripeW)%stripeW;
    for(let x=-stripeW+offset; x<c.w; x+=stripeW){
      ctx.fillRect(sx+x, sy, 5, 6);
    }
  }
}
function drawTerrain(){
  for(const t of terrain){
    const sx=t.x-camera.x, sy=t.y-camera.y;
    const pattern=getTerrainPattern();
    ctx.fillStyle=pattern||'#252735';
    ctx.fillRect(sx,sy,t.w,t.h);
    ctx.fillStyle='#D97757'; ctx.globalAlpha=0.78; ctx.fillRect(sx,sy,t.w,2);
    ctx.fillStyle='#111629'; ctx.globalAlpha=0.72; ctx.fillRect(sx,sy+3,t.w,2);
    ctx.globalAlpha=1;
  }
}
function drawSlug(){
  if(!slug || !slug.active) return;
  const sx = Math.round(slug.x-camera.x), sy = Math.round(slug.y-camera.y);
  if(drawArtAtFeet(ART.slug,sx,sy+5,36,player.facing<0)){
    if(slug.flash>0){
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.45;
      ctx.fillStyle='#ffe8bf'; ctx.fillRect(sx-24,sy-32,48,28); ctx.restore();
    }
    return;
  }
  const spr = slug.flash>0 ? SPR.slugFlash : SPR.slug;
  ctx.drawImage(spr, sx-Math.floor(spr.width/2), sy-spr.height+3);
}
function drawPlayer(){
  if(!player.alive || player.riding) return;
  if(!demoActive && player.invincible>0 && Math.floor(player.invincible/4)%2===0) return;
  const sx = Math.round(player.x-camera.x), sy = Math.round(player.y-camera.y);
  let art = null, artHeight = 31;
  if(player.hitTimer>0){ art=ART.player.hit; artHeight=31; }
  else if(player.attackTimer>0){ art=ART.player.shoot[Math.floor(player.attackTimer/2)%ART.player.shoot.length]; artHeight=31; }
  else if(player.state==='crouch'){ art=ART.player.crouch; artHeight=27; }
  else if(player.state==='jump'){ art=ART.player.jump; artHeight=34; }
  else if(player.state==='run'){ art=ART.player.run[player.runFrame%ART.player.run.length]; artHeight=32; }
  else { art=ART.player.idle; artHeight=32; }
  if(drawArtAtFeet(art,sx,sy+2,artHeight,player.facing<0)) return;
  let spr;
  const useFlash = player.hitTimer>0 && Math.floor(player.hitTimer/3)%2===0;
  if(player.state==='crouch') spr = player.facing>0?SPR.playerCrouch:SPR.playerCrouchL;
  else if(player.state==='jump') spr = player.facing>0?SPR.playerJump:SPR.playerJumpL;
  else if(player.state==='run') spr = player.facing>0?SPR.playerRun[player.runFrame%SPR.playerRun.length]:SPR.playerRunL[player.runFrame%SPR.playerRunL.length];
  else spr = player.facing>0?SPR.playerIdle:SPR.playerIdleL;
  if(useFlash) spr = player.facing>0?SPR.playerFlash:SPR.playerFlashL;
  ctx.drawImage(spr, sx-Math.floor(spr.width/2), sy-spr.height+2);

  if(player.hitTimer<=0){
    const gx = sx + Math.round(player.aim.x*7);
    const gy = sy-8 + Math.round(player.aim.y*6);
    const g = SPR.gun[player.aim.snapKey];
    if(g) ctx.drawImage(g, gx-2, gy-2);
  }
}
function drawEnemies(){
  for(const en of enemies){
    if(!en.active) continue;
    const sx = Math.round(en.x-camera.x), sy=Math.round(en.y-camera.y);
    if(sx<-20||sx>CFG.W+20) continue;
    const art = ART.enemies[en.type];
    const artHeight = en.type==='stackov'||en.type==='deprecated'?24:(en.type==='infloop'||en.type==='racecond'?20:16);
    if(drawArtAtFeet(art,sx,sy,artHeight,en.facing<0)){
      if(en.flash>0){
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.5;
        ctx.fillStyle='#fff4d6'; ctx.fillRect(sx-artHeight/2,sy-artHeight,artHeight,artHeight*0.75); ctx.restore();
      }
      continue;
    }
    let spr;
    if(en.type==='nullptr') spr = en.flash>0?SPR.npBugFlash:(en.facing>0?SPR.npBug:SPR.npBugL);
    else if(en.type==='segfault') spr = en.flash>0?SPR.sfBugFlash:(en.facing>0?SPR.sfBug:SPR.sfBugL);
    else if(en.type==='infloop') spr = en.flash>0?SPR.ilBugFlash:SPR.ilBug;
    else if(en.type==='stackov') spr = en.flash>0?SPR.stackovFlash:(en.facing>0?SPR.stackov:SPR.stackovL);
    else if(en.type==='memleak') spr = en.flash>0?SPR.memleakFlash:(en.facing>0?SPR.memleak:SPR.memleakL);
    else if(en.type==='deprecated') spr = en.flash>0?SPR.deprecatedFlash:SPR.deprecated;
    else spr = en.flash>0?SPR.racecondFlash:(en.facing>0?SPR.racecond:SPR.racecondL);
    ctx.drawImage(spr, sx-Math.floor(spr.width/2), sy-spr.height);
  }
}
function drawBoss(){
  if(!boss || !boss.active) return;
  const bossArt = ART.bosses[boss.type];
  if(artReady(bossArt)){
    const sx=Math.round(boss.x-camera.x), sy=Math.round(boss.y-camera.y);
    const targetHeight = boss.type==='gate1'?78:(boss.type==='hydra'?84:88);
    if(boss.type==='halluc' && boss.decoyOffsets){
      for(const off of boss.decoyOffsets) drawArtAtFeet(bossArt,sx+off,sy+4,targetHeight*0.82,false,0.16);
    }
    drawArtAtFeet(bossArt,sx,sy+4,targetHeight,player.facing<0);
    if(boss.flash>0){
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.42;
      ctx.fillStyle='#fff2c7'; ctx.fillRect(sx-targetHeight*0.7,sy-targetHeight,targetHeight*1.4,targetHeight*0.85); ctx.restore();
    }
    return;
  }
  if(boss.type==='halluc' && boss.decoyOffsets){
    for(const off of boss.decoyOffsets){
      const dx = Math.round(boss.x+off-camera.x), dy = Math.round(boss.y-camera.y);
      const dw = SPR.hallucDecoy.width*boss.scale, dh = SPR.hallucDecoy.height*boss.scale;
      ctx.drawImage(SPR.hallucDecoy, dx-Math.floor(dw/2), dy-dh, dw, dh);
    }
  }
  const sx = Math.round(boss.x-camera.x), sy = Math.round(boss.y-camera.y);
  let spr;
  if(boss.type==='gate1') spr = boss.vulnerable ? SPR.gate1 : SPR.gate1Armored;
  else if(boss.type==='hydra') spr = boss.vulnerable ? SPR.hydra : SPR.hydraArmored;
  else spr = SPR.halluc;
  if(boss.flash>0){
    if(boss.type==='gate1') spr = SPR.gate1Flash;
    else if(boss.type==='hydra') spr = SPR.hydraFlash;
    else spr = SPR.hallucFlash;
  }
  const dw = spr.width*boss.scale, dh = spr.height*boss.scale;
  ctx.drawImage(spr, sx-Math.floor(dw/2), sy-dh, dw, dh);
}
function drawBossGauge(){
  if(!boss || !boss.active) return;
  const w = CFG.W-40, x=20, y=CFG.H-14;
  ctx.fillStyle='#000'; ctx.fillRect(x-1,y-1,w+2,7);
  ctx.fillStyle='#442222'; ctx.fillRect(x,y,w,5);
  ctx.fillStyle = boss.vulnerable ? '#ff5566' : '#8899aa';
  ctx.fillRect(x,y,Math.max(0,w*(boss.hp/boss.maxHp)),5);
  ctx.fillStyle='#fff'; ctx.font='7px monospace'; ctx.textAlign='center';
  ctx.fillText(boss.name, CFG.W/2, y-3);
}
function drawBullets(){
  ctx.fillStyle='#ffe27a';
  for(const b of bullets){ if(b.active) ctx.fillRect(Math.round(b.x-camera.x)-1, Math.round(b.y-camera.y)-1, 2,2); }
  ctx.fillStyle='#ff6688';
  for(const b of enemyBullets){ if(b.active) ctx.fillRect(Math.round(b.x-camera.x)-1, Math.round(b.y-camera.y)-1, 2,2); }
  ctx.fillStyle='#8a9a4a';

function drawItems(){

function drawPows(){

    if(!p.active || p.freed) continue;

function drawFx(){
  for(const p of particles){
    if(!p.active) continue;
    ctx.globalAlpha = Math.max(0,p.life/p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x-camera.x), Math.round(p.y-camera.y), p.size, p.size);
  }
  ctx.globalAlpha=1;
  ctx.font='8px monospace'; ctx.textAlign='center';
  for(const p of popups){
    if(!p.active) continue;
    ctx.fillStyle='#ffe27a';
    ctx.fillText(p.text, Math.round(p.x-camera.x), Math.round(p.y-camera.y));
  }
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const burst of combatBursts){
    const x=burst.x-camera.x, y=burst.y-camera.y;
    const life=burst.life/burst.maxLife;
    if(burst.kind==='explosion'){
      const r=(1-life)*24+4;
      ctx.globalAlpha=life;
      ctx.strokeStyle='#FFE79B'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='#F26D49'; ctx.lineWidth=1;
      for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r*0.6,y+Math.sin(a)*r*0.6); ctx.lineTo(x+Math.cos(a)*r*1.35,y+Math.sin(a)*r*1.35); ctx.stroke(); }
    } else {
      const len=burst.kind==='tank-muzzle'?14:8+life*4;
      ctx.globalAlpha=life;
      ctx.strokeStyle=burst.kind==='tank-muzzle'?'#F2A181':'#FFE79B'; ctx.lineWidth=burst.kind==='tank-muzzle'?4:2;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+burst.dx*len,y+burst.dy*len); ctx.stroke();
      ctx.fillStyle='#fff5d6'; ctx.beginPath(); ctx.arc(x+burst.dx*len,y+burst.dy*len,burst.kind==='tank-muzzle'?4:2,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
}
function drawOnboarding(){
  if(!onboarding.active || !onboarding.current) return;
  const card = onboarding.current;
  ctx.save();
  ctx.fillStyle='rgba(5,7,14,0.82)';
  ctx.fillRect(0,0,CFG.W,CFG.H);
  const x=18, y=14, w=348, h=188;
  ctx.fillStyle='#111629'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#D97757'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.fillStyle='#F2A181'; ctx.fillRect(x+8,y+8,4,18);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#F2A181'; ctx.font='7px monospace'; ctx.fillText(card.kicker, x+20, y+15);
  ctx.fillStyle='#fff'; ctx.font='bold 12px monospace'; ctx.fillText(card.title, x+20, y+32);
  ctx.fillStyle='#c9cedd'; ctx.font='7px monospace';
  let bodyY=y+48;
  const words=card.body.split(' '); let line='';
  for(const word of words){
    const next=line?line+' '+word:word;
    if(ctx.measureText(next).width>310 && line){ ctx.fillText(line,x+20,bodyY); bodyY+=9; line=word; }
    else line=next;
  }
  if(line){ ctx.fillText(line,x+20,bodyY); bodyY+=10; }
  const rowsY=Math.max(y+73,bodyY+3);
  card.rows.forEach((row,i)=>{
    const ry=rowsY+i*18;
    ctx.fillStyle='#2b3044'; ctx.fillRect(x+12,ry-10,w-24,15);
    ctx.fillStyle='#FFE79B'; ctx.font='bold 7px monospace'; ctx.fillText(row[0],x+20,ry);
    ctx.fillStyle='#e5e8f0'; ctx.font='7px monospace'; ctx.fillText(row[1],x+124,ry);
  });
  ctx.fillStyle='#8e96aa'; ctx.font='6px monospace'; ctx.textAlign='center'; ctx.fillText(card.hint,CFG.W/2,y+h-8);
  ctx.restore();
}
function drawHUD(){
  ctx.textAlign='left'; ctx.font='8px monospace';
  ctx.fillStyle='#fff';
  ctx.fillText('SCORE '+String(score).padStart(7,'0'), 6, 12);
  ctx.fillText('HI '+String(hiScore).padStart(7,'0'), 130, 12);
  ctx.font='6px monospace';
  ctx.fillText('STAGE '+stageNum+' '+STAGE_NAMES[stageNum-1], CFG.W-110, 12);
  for(let i=0;i<player.lives;i++){
    ctx.fillStyle='#D97757';
    ctx.fillText('*', 6+i*10, 24);
  }
  const wdef = WEAPONS[player.weapon];
  ctx.fillStyle='#ffe27a';
  const wtxt = wdef.infinite ? 'PROMPT INF' : (wdef.code+' '+player.ammo);
  ctx.fillText(wtxt, 250, 12);
  ctx.fillStyle='#8a9a4a';
  ctx.fillText('*'+player.grenades, 250, 24);
  if(player.riding && slug){
    ctx.fillStyle='#80c0e0';
    ctx.fillText('TANK '+'#'.repeat(slug.durability)+'-'.repeat(SLUG_MAX_DUR-slug.durability), 250, 36);
  }
}
function drawTitle(){
  drawParallax();
  ctx.fillStyle='#D97757'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
  ctx.fillText('CURSOR SLUG', CFG.W/2, 80);
  ctx.fillStyle='#fff'; ctx.font='9px monospace';
  ctx.fillText('PRESS ANY KEY OR CLICK', CFG.W/2, 130);
  ctx.font='7px monospace'; ctx.fillStyle='#aaa';
  ctx.fillText('ARROWS MOVE  Z JUMP  X SHOOT  MOUSE AIM', CFG.W/2, 150);
  ctx.fillText('HI-SCORE '+hiScore, CFG.W/2, 165);
}
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,CFG.W,CFG.H);
  ctx.fillStyle='#ff5555'; ctx.font='bold 20px monospace'; ctx.textAlign='center';
  ctx.fillText('GAME OVER', CFG.W/2, 90);
  ctx.fillStyle='#fff'; ctx.font='9px monospace';
  ctx.fillText('SCORE '+score, CFG.W/2, 115);
  if(score>=hiScore && score>0){
    ctx.fillStyle='#ffe27a'; ctx.fillText('NEW RECORD!', CFG.W/2, 130);
  }
  ctx.fillStyle='#aaa'; ctx.font='7px monospace';
  ctx.fillText('PRESS R OR CLICK RESTART', CFG.W/2, 150);
}
function drawStageClear(){
  drawParallax();
  ctx.fillStyle='#7fffb0'; ctx.font='bold 18px monospace'; ctx.textAlign='center';
  ctx.fillText('MISSION COMPLETE', CFG.W/2, 80);
  ctx.fillStyle='#fff'; ctx.font='9px monospace';
  ctx.fillText('SIGKILL BONUS +'+stageClearBonus, CFG.W/2, 105);
  ctx.fillText('SCORE '+score, CFG.W/2, 120);
  if(stageClearTimer<=0){
    ctx.fillStyle='#ffe27a'; ctx.font='7px monospace';
    ctx.fillText('PRESS ANY KEY OR CLICK TO CONTINUE', CFG.W/2, 145);
  }
}
function drawEnding(){
  drawParallax();
  ctx.fillStyle='#D97757'; ctx.font='bold 18px monospace'; ctx.textAlign='center';
  ctx.fillText('MISSION ACCOMPLISHED', CFG.W/2, 80);
  ctx.fillStyle='#fff'; ctx.font='9px monospace';
  ctx.fillText('FINAL SCORE '+score, CFG.W/2, 105);
  ctx.fillText('HI-SCORE '+hiScore, CFG.W/2, 120);
  ctx.fillStyle='#aaa'; ctx.font='7px monospace';
  ctx.fillText('THANK YOU FOR PLAYING', CFG.W/2, 140);
  ctx.fillText('PRESS R OR CLICK RESTART', CFG.W/2, 155);
}

function render(){
  ctx.save();
  if(shakeTime>0){
    ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
  }
  if(scene==='TITLE'){
    drawTitle();
  } else if(scene==='STAGECLEAR'){
    drawStageClear();
  } else if(scene==='ENDING'){
    drawEnding();
  } else {
    drawParallax();
    drawTerrain();
    drawConveyors();
    drawItems();
    drawPows();
    drawEnemies();
    drawBoss();
    drawSlug();
    drawPlayer();
    drawBullets();
    drawFx();
    drawHUD();
    drawBossGauge();
    if(scene==='GAMEOVER') drawGameOver();
  }
  ctx.restore();
  if(onboarding.active) drawOnboarding();
  if(demoActive) drawDemoOverlay();
}

/* ============================= §13 LOOP =================================== */
let lastTime = performance.now();
let accumulator = 0;
function update(){
  if(scene!=='PLAY') return;
  if(demoActive){
    player.lives = Math.max(player.lives, 3);
    if(player.invincible < 20) player.invincible = 40;
    demoDrive();
  }
  if(onboarding.active){ Input.justDown = {}; Input.mouseRightJustDown = false; return; }
  if(bossEntryGrace>0) bossEntryGrace--;
  updatePlayer();
  checkBossTrigger();
  updateBoss();
  updateEnemies();
  updateSpawns();
  updateItemSpawns();
  updateItems();
  updatePowSpawns();
  updatePows();
  updateBullets();
  updateFx();
}
function frame(now){
  requestAnimationFrame(frame);
  if(demoActive) demoAutoScene();
  let dt = now-lastTime; lastTime=now;
  if(dt>250) dt=250;
  if(hitstop>0){ hitstop--; render(); return; }
  accumulator += dt;
  while(accumulator>=CFG.FIXED_DT){
    if(scene==='PLAY') updateCamera();
    update();
    if(scene==='STAGECLEAR' && stageClearTimer>0) stageClearTimer--;
    accumulator -= CFG.FIXED_DT;
  }
  render();
}

/* ============================= §DEMO / ATTRACT MODE ===================== */
/* Everything here is inert unless the page was opened with ?demo=1 (or #demo).
   It only writes to Input / scene transitions the same way a player would,
   plus keeps lives pinned so a showcase reel never ends on GAME OVER.
   The moment a real key or mouse button is pressed, demoActive flips off and
   the game is a 100% normal, hand-played build again. */
if(DEMO_ON){
  const st = document.createElement('style');
  st.textContent = '#game{width:100vw!important;height:100vh!important;box-shadow:none!important}#restartBtn{display:none!important}';
  document.head.appendChild(st);
  const tag = document.createElement('div');
  tag.id = 'demoTag';
  tag.textContent = '▶ ATTRACT MODE — press any key to play';
  tag.style.cssText = 'position:fixed;left:14px;bottom:12px;z-index:20;pointer-events:none;'
    + 'font:12px/1 monospace;letter-spacing:1px;color:#ffe27a;opacity:.72;text-shadow:0 1px 3px #000';
  document.body.appendChild(tag);
  queueOnboarding = function(){};      // no blocking tutorial popups in the reel
  onboarding.active = false;
  const handOver = function(){
    if(!demoActive) return;
    demoActive = false;
    player.lives = 3; player.invincible = 90;   // clean slate for the human
    Input.keys = {}; Input.justDown = {};
    const t = document.getElementById('demoTag'); if(t) t.remove();
  };
  window.addEventListener('keydown', handOver, true);
  window.addEventListener('mousedown', handOver, true);
  window.__demo = {   // read-only probe for the recording script / debugging
    get scene(){ return scene; },
    get stage(){ return stageNum; },
    get x(){ return Math.round(player.x); },
    get lives(){ return player.lives; },
    get weapon(){ return player.weapon; },
    get riding(){ return !!player.riding; },
    get boss(){ return boss ? { active: boss.active, dying: !!boss.dying, hp: Math.round(boss.hp), max: boss.maxHp, type: boss.type } : null; },
    get active(){ return demoActive; }
  };
}

let demoTitleT = 0, demoEndT = 0;
function demoAutoScene(){
  if(!demoActive) return;
  if(scene === 'TITLE'){ if(++demoTitleT > 96) resetGame(); return; }
  demoTitleT = 0;
  if(scene === 'STAGECLEAR' && stageClearTimer <= 0) advanceStage();
  else if(scene === 'ENDING'){ if(++demoEndT > 210){ demoEndT = 0; resetGame(); } }
  else demoEndT = 0;
}

let demoT = 0, demoStuckX = 0, demoStuckN = 0, demoJumpCd = 0, demoNadeCd = 0, demoWpnStage = -1;
function demoThreat(){
  let best = null, bd = 1e9;
  for(const e of enemies){
    if(!e.active) continue;
    if(e.x < player.x - 44) continue;
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function demoBulletNear(){
  for(const b of enemyBullets){
    if(!b.active) continue;
    if(Math.abs(b.x - player.x) < 30 && Math.abs(b.y - (player.y - 10)) < 22 && (b.x - player.x) * b.vx < 0) return true;
  }
  return false;
}
function demoDrive(){
  if(!demoActive || scene !== 'PLAY') return;
  demoT++;
  const K = Input.keys;
  K.ArrowRight = K.ArrowLeft = K.ArrowUp = K.ArrowDown = K.KeyX = false;
  Input.aimMode = 'keyboard';
  K.KeyX = true;   // hold fire

  const B = (typeof boss !== 'undefined') ? boss : null;
  const inBoss = bossFightActive && B && B.active && !B.dying;

  if(inBoss){
    if(!B._demoTuned){ B._demoTuned = true; B._demoT = 0; if(WEAPONS.L) collectWeapon('L'); }
    B._demoT++;
    // Pace every boss fight to ~8s of action then a scripted finish, so the reel
    // is predictable regardless of how well the bot aims. Real hits still count
    // and can drain it faster; the ramp only guarantees forward progress.
    const FIGHT = 520;
    if(!B.dying) B.hp = B.maxHp * Math.max(0.001, 1 - B._demoT / FIGHT);
    if(B._demoT >= FIGHT && !B.dying){ B.hp = 0; B.dying = true; B.deathTimer = 90; }
    const gap = B.x - player.x;
    if(gap > 108) K.ArrowRight = true;
    else if(gap < 82) K.ArrowLeft = true;
    else if(Math.floor(demoT / 30) % 2 === 0) K.ArrowRight = true; else K.ArrowLeft = true;
    if((B.y - B.hh) < (player.y - 18) && Math.floor(demoT / 42) % 2 === 0) K.ArrowUp = true;
    if(player.onGround && demoJumpCd <= 0 && demoBulletNear()){ Input.justDown.Space = true; demoJumpCd = 38; }
    if(demoNadeCd <= 0){ Input.justDown.KeyC = true; demoNadeCd = 230; }
  } else {
    K.ArrowRight = true;
    const thr = demoThreat();
    if(thr && (thr.y - player.y) < -14) K.ArrowUp = true;
    const blocked = (player.x - demoStuckX) < 0.25;
    const enemyAhead = thr && (thr.x - player.x) < 32 && (thr.x - player.x) > -8;
    if(player.onGround && demoJumpCd <= 0 && (blocked || enemyAhead || demoBulletNear() || demoT % 168 === 0)){
      Input.justDown.Space = true; demoJumpCd = 26;
    }
    let cluster = 0;
    for(const e of enemies) if(e.active && Math.abs(e.x - player.x) < 72) cluster++;
    if(cluster >= 3 && demoNadeCd <= 0){ Input.justDown.KeyC = true; demoNadeCd = 170; }
    if(stageNum !== demoWpnStage && player.x > 380){
      const pick = stageNum === 1 ? 'S' : stageNum === 2 ? 'F' : 'R';
      if(WEAPONS[pick]){ collectWeapon(pick); demoWpnStage = stageNum; }
    }
  }

  if((player.x - demoStuckX) > 0.25){ demoStuckX = player.x; demoStuckN = 0; }
  else if(++demoStuckN > 168 && !inBoss){ player.vx = Math.max(player.vx, 1.5); demoStuckN = 110; }
  if(demoJumpCd > 0) demoJumpCd--;
  if(demoNadeCd > 0) demoNadeCd--;
}

let demoCardT = 0, demoCardN = 0;
function drawDemoOverlay(){
  if(scene === 'PLAY' && demoCardN !== stageNum){ demoCardN = stageNum; demoCardT = 168; }
  if(demoCardT > 0){
    demoCardT--;
    const a = Math.min(1, demoCardT / 26) * Math.min(1, (168 - demoCardT) / 18);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8,10,18,0.62)';
    ctx.fillRect(0, CFG.H / 2 - 17, CFG.W, 34);
    ctx.fillStyle = '#D97757'; ctx.strokeStyle = 'rgba(217,119,87,0.5)';
    ctx.fillRect(0, CFG.H / 2 - 17, CFG.W, 1); ctx.fillRect(0, CFG.H / 2 + 16, CFG.W, 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 11px monospace';
    ctx.fillText('STAGE ' + stageNum, CFG.W / 2, CFG.H / 2 - 3);
    ctx.fillStyle = '#fff'; ctx.font = '7px monospace';
    ctx.fillText(STAGE_NAMES[stageNum - 1], CFG.W / 2, CFG.H / 2 + 9);
    ctx.restore();
  }
}

buildSprites();
requestAnimationFrame(frame);
</script>
